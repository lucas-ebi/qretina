name: Sign payload

# Signs a program from this repo and produces a looping GIF of QR codes, using a private key that
# lives only in GitHub. Run it from Actions -> Sign payload -> Run workflow, or:
#   gh workflow run sign.yml -f file=examples/snake.html -f id=snake
# then fetch the GIF with:  gh run download <run-id>
#
# Each loop of the GIF starts with a countdown of QR codes of the app link, so a phone's camera app
# opens QRetina before the data frames begin.
#
# The key is an *environment* secret named SIGNING_KEY in the `signing` environment, so it can be
# limited to `main` and to reviewers. APP_KEY in the same environment seals the output as the app does.

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Path of the payload in this repo (for example examples/snake.html)'
        required: true
      id:
        description: 'Program id (1 to 64 letters, digits, _ . -)'
        required: true
      version:
        description: 'Version number (default: current Unix time)'
        required: false
      block:
        description: 'Bytes per QR block'
        required: false
        default: '700'
      intro:
        description: 'Seconds of countdown to the app link at the start of each loop (0 to disable, max 9)'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Sign
        # Inputs go through env vars, never into the script text, so they cannot inject commands.
        run: |
          case "$FILE" in
            /*|*..*) echo "file must be a relative path inside the repo" >&2; exit 1 ;;
          esac
          [ -f "$FILE" ] || { echo "no such file: $FILE" >&2; exit 1; }
          node tools/qretina.mjs sign "$FILE" --id "$APP_ID" --block "$BLOCK" \
            ${VERSION:+--version "$VERSION"} --intro "$INTRO" --gif "$RUNNER_TEMP/$APP_ID.gif"
        env:
          QRETINA_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          QRETINA_APP_KEY: ${{ secrets.APP_KEY }}
          FILE: ${{ inputs.file }}
          APP_ID: ${{ inputs.id }}
          VERSION: ${{ inputs.version }}
          BLOCK: ${{ inputs.block }}
          INTRO: ${{ inputs.intro }}
      - uses: actions/upload-artifact@v7
        with:
          name: qretina-${{ inputs.id }}
          path: ${{ runner.temp }}/${{ inputs.id }}.gif
          retention-days: 14
