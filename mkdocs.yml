site_name: QRetina
site_url: https://docs.qretina.app/
site_description: Files and signed programs through QR codes, with no network.
repo_url: https://github.com/lucas-ebi/qr-bootstrap
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      toggle: { icon: material/brightness-4, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      toggle: { icon: material/brightness-7, name: Light }
nav:
  - Overview: index.md
  - Using the app: app.md
  - Command line: cli.md
  - Publishing programs: publishing.md
  - Protocol:
      - Explanation: protocol.md
      - Specification: protocol-spec.md
  - Security: security.md
  - Development: development.md
markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
