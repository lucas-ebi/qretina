# ResQR transfer protocol: normative parameters.
#
# The protocol identifier is "RQR" followed by the first six hexadecimal digits, in upper case, of
# SHA-256 over the canonical JSON (RFC 8785) of `parameters`. Any change to `parameters` gives a new
# identifier, and receivers ignore frames that carry another one. Comments, formatting and
# `vectors` do not enter the digest. The explanation of these parameters is in docs/protocol.md.

parameters:
  revision: 1

  frame:
    grammar: # ABNF (RFC 5234)
      - frame     = protocol "/" stream-id "/" n "/" len "/" seed "/" symbol
      - protocol  = "RQR" 6HEXDIG        ; upper case
      - stream-id = 16HEXDIG             ; upper case
      - n         = 1*4DIGIT
      - len       = 1*7DIGIT
      - seed      = 1*10DIGIT
      - symbol    = 1*base45-char        ; RFC 9285
    limits:
      max-n: 4096
      max-len: 4194304
      max-block: 2900
    constraints:
      - 1 <= n <= max-n
      - 2 <= len <= max-len
      - n <= len
      - 0 <= seed <= 4294967295
      - b = ceil(len / n) <= max-block
      - symbol decodes to exactly b bytes
    stream-id: the first 8 bytes of SHA-256(container)

  code:
    prng:
      name: mulberry32
      state: 32-bit, initialised to seed
      step:
        - state = state + 0x6D2B79F5
        - t = imul(state xor (state >>> 15), state or 1)
        - t = (t + imul(t xor (t >>> 7), t or 61)) xor t
        - output (t xor (t >>> 14)) as unsigned 32-bit
    mask: >-
      word i of the mask is the (i+1)-th prng output, for i = 0 .. ceil(n / 32) - 1;
      block j is selected iff bit (j mod 32) of word floor(j / 32) is set, for j < n
    blocks: block j = container[j*b .. j*b + b), the last one zero-padded
    symbol: exclusive-or of the selected blocks
    acceptance: the reconstructed container is accepted only if its stream-id matches

  containers:
    compression: deflate-raw (RFC 1951)
    tags:
      - tag: 1
        name: code
        layout: signature(64) || deflate-raw(header LF payload)
        header: type SP id SP version
        type: [html, json]
        id: 1*64(ALPHA / DIGIT / "_" / "." / "-")
        version: 1*15DIGIT
        signature: Ed25519 over domain || deflate-raw(header LF payload)
        domain: "resqr code\0"
      - tag: 2
        name: file
        layout: deflate-raw(meta LF bytes)
        meta: mime SP percent-encoded(name)
      - tag: 3
        name: file-stored
        layout: meta LF bytes
        meta: mime SP percent-encoded(name)

vectors:
  mask:
    seed: 12345
    n: 64
    bits: "1010001100011110111100110101111100000000100010101110000101110010"
  base45:
    - { text: "ietf!", base45: "QED8WEX0" }
    - { text: "base-45", base45: "UJCLQE7W581" }
    - { text: "Hello!!", base45: "%69 VD92EX0" }
  stream: # the file container of "hello.txt" (text/plain, "Hello, ResQR!"), in blocks of at most 8 bytes
    container: "022B49AD28D12FC849CCCC53C848CDC9C9D72BA928E1F200B1741482528B03831401"
    block: 8
    stream-id: "A124DF0DA9C7784A"
    frames: # seeds 1, 2, 3
      - "RQRF6943C/A124DF0DA9C7784A/5/34/1/+EJF2H02ED2"
      - "RQRF6943C/A124DF0DA9C7784A/5/34/2/U8A0H9/U721"
      - "RQRF6943C/A124DF0DA9C7784A/5/34/3/IPJG9QH39R1"
